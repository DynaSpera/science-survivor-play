<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#162620">
<meta name="description" content="빛으로 양분을 모아 잎으로 온실을 지키는 사이언스 서바이버의 햇살나무 시험판.">
<title>햇살나무 · 사이언스 서바이버</title>
<style>
:root{color-scheme:dark;--back:#101a17;--panel:#1e2d26;--line:#42574a;--text:#f6f3e6;--muted:#c0cdc2;--leaf:#bdd77c;--sun:#f7d76f;--danger:#ff9b8b}
*{box-sizing:border-box}
body{margin:0;background:var(--back);color:var(--text);font:16px/1.5 "Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:4px}
button:disabled{opacity:.55;cursor:default}
[hidden]{display:none!important}
main{max-width:1560px;padding:clamp(10px,2.5vw,32px);margin:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px}
.header-controls{display:flex;gap:6px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:35px;height:35px;display:grid;place-items:center;background:var(--leaf);color:#193122;font-size:23px;font-weight:bold;transform:rotate(-8deg);border-radius:9px}
.brand strong{display:block;font-size:20px;line-height:1.2}
.brand small{color:var(--muted);font-size:13px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 248px;gap:12px;align-items:start}
.board,.inventory{border:1px solid var(--line);border-radius:13px;background:var(--panel);overflow:hidden}
.hud{display:grid;grid-template-columns:minmax(100px,1fr) auto minmax(100px,1fr);align-items:center;gap:12px;padding:11px 15px;border-bottom:1px solid var(--line)}
.hud strong{font-size:14px}
.clock{font:800 clamp(22px,4vw,34px)/1.1 ui-monospace,Consolas,monospace;color:var(--sun);font-variant-numeric:tabular-nums}
.phase,.bar-label{color:var(--muted);font-size:13px}
.phase{text-align:center}
.bar-label{display:flex;justify-content:space-between;gap:5px;font-weight:700}
.progress{height:8px;border-radius:4px;background:#101e18;overflow:hidden}
.progress span{display:block;background:var(--leaf);width:0%;height:100%}
#quizStatus{display:block;color:var(--danger);font-size:12px;font-weight:750;font-variant-numeric:tabular-nums}
#healthBar span{background:var(--danger)}
#fuelBar span{background:var(--sun)}
.arena{position:relative;height:clamp(390px,68svh,790px);overflow:hidden;background:#263a2d;isolation:isolate}
canvas{display:block;width:100%;height:100%;touch-action:none}
.minimap{margin:0 0 14px}
.minimap figcaption{margin-bottom:6px;color:#e2eade;font-size:13px;font-weight:750}
.minimap canvas{height:auto;border:1px solid #687e70;border-radius:6px}
.mobile-tools{display:none}
.cover{position:absolute;inset:0;display:flex;align-items:center;padding:clamp(22px,5vw,70px);background:linear-gradient(90deg,#101c17f2 8%,#111e18cf 41%,#15231b08 78%)}
.cover-inner{max-width:440px}
.cover h1{margin:0;font-size:clamp(50px,9vw,124px);font-weight:950;letter-spacing:-.105em;line-height:1.04;color:#f8f2d3}
.cover p{margin:17px 0 25px;color:#e2ead7;font-size:clamp(15px,2vw,18px)}
.cover img{display:none}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
.button{border:1px solid #698071;border-radius:8px;background:#263b30;color:var(--text);padding:8px 13px;min-height:42px;font-weight:750}
.button:hover:enabled{background:#385343}
.primary{background:var(--sun);color:#2d2512;border-color:var(--sun)}
.primary:hover:enabled{background:#ffe7a0}
.boss{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(440px,74%);text-align:center;background:#251e22eb;border:1px solid #a45f64;border-radius:8px;padding:5px 12px 9px;font-weight:800;pointer-events:none}
.boss .progress span{background:#ff9b8b}
.stats{display:flex;align-items:center;gap:12px;padding:8px 13px;border-top:1px solid var(--line);font-size:14px}
.stats span{white-space:nowrap}
.stats .progress{flex:1}
.inventory{padding:15px}
.gear h3{font-size:14px;line-height:1.3;margin:0 0 7px}
.gear h3:not(:first-child){margin-top:14px}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;list-style:none;padding:0;margin:0;max-width:280px}
.slot{display:grid;place-items:center;min-width:0;aspect-ratio:1;border:1px dashed #4e6357;border-radius:7px;background:#15241d}
.slot:has(button){border:0}
.slot-button{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;width:100%;height:100%;padding:3px 0;border:1px solid #799563;border-radius:7px;background:#273d30;color:var(--leaf)}
.passive-slots .slot-button{border-color:#607f84;background:#20373b;color:#b8e7ed}
.slot-button:hover,.slot-button:focus-visible{background:#365043}
.slot-button.evolved{border-color:var(--sun);color:var(--sun);box-shadow:inset 0 0 6px #f7d76f35}
.item-icon{display:block;width:clamp(24px,6vw,32px);aspect-ratio:1;background-size:500% 600%;background-repeat:no-repeat;image-rendering:pixelated}
.slot-dots{display:flex;gap:3px;align-items:center}
.slot-dots i{width:5px;height:5px;border:1px solid currentColor;border-radius:50%}
.slot-dots .filled{background:currentColor}
.gear-detail{display:block;min-height:54px;margin-top:10px;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:#182720;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.gear-detail strong{display:block;color:var(--text)}
.gear-summary{display:flex;flex-wrap:wrap;gap:3px 10px;margin-top:9px;font-size:12px;color:var(--sun)}
.gear-summary #training{font-size:12px}
.equipment-dialog .slots{max-width:264px}
#training{font-size:14px;color:var(--leaf)}
#penalty{color:var(--danger);font-weight:750}
dialog{width:min(550px,calc(100vw - 24px));max-height:calc(100svh - 26px);color:var(--text);background:#1b3027;border:1px solid #718879;border-radius:14px;padding:clamp(18px,4vw,30px);box-shadow:0 16px 80px #0007}
dialog::backdrop{background:#09150fd2}
dialog h2{margin:0 0 12px;font-size:clamp(22px,4.5vw,31px);line-height:1.3}
dialog p{margin:0 0 12px}
.world-map{height:auto;margin:0 0 14px;border:1px solid #687e70;border-radius:6px}
.quiz-data{width:100%;margin:8px 0 14px;border-collapse:collapse;font-size:clamp(12px,3vw,14px);font-variant-numeric:tabular-nums}
.quiz-data caption{caption-side:bottom;color:var(--muted);text-align:left;font-size:12px;padding-top:5px}
.quiz-data :is(th,td){padding:5px 6px;border:1px solid var(--line);text-align:center}
.quiz-data th{background:#253d32}
.choose{display:block;width:100%;text-align:left;margin:8px 0 0}
.choose small{display:block;color:#d9e7d9;font-weight:500;font-size:14px;margin-top:3px}
.choose[data-answer="true"]{border-color:#b7e594;opacity:1}
.choose[data-answer="false"]{border-color:var(--danger);opacity:1}
.help{list-style:none;margin:8px 0;padding:0}
.help li{padding:8px 0;border-top:1px solid var(--line)}
.help strong{color:var(--sun);margin-right:7px}
@media(max-width:850px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .inventory{padding:8px 10px}
  .inventory:has(.mobile-tools[hidden]){display:none}
  .inventory .gear{display:none}
  .mobile-tools{display:flex;gap:6px}
  .mobile-tools .button{flex:1;min-height:42px;padding-inline:5px}
  .minimap{width:min(196px,100%);margin:9px auto 0}
  .inventory .minimap:not([data-expanded="true"]){display:none}
  .equipment-dialog{position:fixed;inset:auto 0 0;width:100%;max-width:none;max-height:76svh;margin:0;border-radius:14px 14px 0 0;padding-bottom:max(18px,env(safe-area-inset-bottom))}
}
@media(max-width:560px){
  header{margin-bottom:7px}.brand strong{font-size:16px}
  .header-controls .button{padding-inline:9px}
  .arena{height:clamp(335px,66svh,680px)}
  .hud{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);padding:7px 9px;gap:8px}.phase,.bar-label{font-size:11px}
  .cover{align-items:flex-end;padding-bottom:23px;background:linear-gradient(0deg,#111e18f5 5%,#111e18bd 49%,#15231b03 90%)}
  .cover h1{font-size:clamp(53px,15vw,80px)}
  .cover p{margin:10px 0 15px}
}
</style>
</head>
<body>
<main>
  <header>
    <div class="brand"><div class="mark" aria-hidden="true">♣</div><div><strong>사이언스 서바이버</strong><small>식물과 에너지</small></div></div>
    <div class="header-controls">
      <button id="mapButton" class="button" type="button" aria-keyshortcuts="M" disabled>지도</button>
      <button id="pause" class="button" type="button" disabled>일시정지</button>
    </div>
  </header>
  <div class="layout">
    <section class="board" aria-label="햇살나무 전투 구역">
      <div class="hud">
        <div><div class="bar-label"><span>체력</span><span id="healthText">125 / 125</span></div><div id="healthBar" class="progress" role="progressbar" aria-label="체력" aria-valuemax="125" aria-valuenow="125"><span style="width:100%"></span></div></div>
        <div class="phase"><div id="clock" class="clock">1:30</div><strong id="phase">라운드 1 / 3</strong><span id="quizStatus" hidden></span></div>
        <div><div class="bar-label"><span>저장 양분</span><span id="fuelText">0 / 100</span></div><div id="fuelBar" class="progress" role="progressbar" aria-label="저장 양분" aria-valuemax="100" aria-valuenow="0"><span></span></div></div>
      </div>
      <div class="arena">
        <canvas id="field" aria-label="온실 전투 지도"></canvas>
        <div id="bossBar" class="boss" hidden><div id="bossName"></div><div id="bossHealth" class="progress" role="progressbar" aria-label="보스 체력"><span></span></div></div>
        <section class="cover" id="cover">
          <div class="cover-inner">
            <h1>햇살나무</h1>
            <p>빛으로 양분을 모으고, 잎사귀로 온실을 지키세요.</p>
            <div class="actions"><button id="start" class="button primary" type="button">게임 시작</button><button id="help" class="button" type="button">도움말</button></div>
          </div>
        </section>
      </div>
      <div class="stats"><span id="level">Lv. 1</span><div class="progress" id="xpBar" role="progressbar" aria-label="다음 레벨까지 경험치" aria-valuemax="5" aria-valuenow="0"><span></span></div><span id="chipText">칩 0</span></div>
    </section>
    <aside class="inventory" aria-label="미니맵과 장비">
      <div id="mobileTools" class="mobile-tools" hidden>
        <button id="minimapToggle" class="button" type="button" aria-controls="minimapPanel" aria-expanded="false">미니맵</button>
        <button id="gearButton" class="button" type="button" aria-haspopup="dialog">장비</button>
      </div>
      <figure id="minimapPanel" class="minimap" hidden>
        <figcaption>미니맵</figcaption>
        <canvas id="minimap" width="416" height="288" role="img" aria-label="현재 전투 화면에 있는 햇살나무, 드론, 오브젝트와 빛 구역"></canvas>
      </figure>
      <section id="desktopGear" class="gear" aria-label="장착한 장비">
        <h3 id="weaponHeading">스킬</h3>
        <ul id="weapons" class="slots" aria-labelledby="weaponHeading"></ul>
        <h3 id="passiveHeading">패시브</h3>
        <ul id="passives" class="slots passive-slots" aria-labelledby="passiveHeading"></ul>
        <output id="gearDetail" class="gear-detail"></output>
        <div class="gear-summary"><span id="loot">연구 상자 0개</span><span id="training" hidden></span></div>
      </section>
    </aside>
  </div>
</main>
<dialog id="modal" aria-labelledby="modalTitle">
  <h2 id="modalTitle"></h2>
  <div id="modalContent"></div>
</dialog>

const canvas = $("field");

  point.x=clamp(point.x,margin,WORLD.w-margin);
  point.y=clamp(point.y,margin,WORLD.h-margin);
};
const mix = (a,b,n) => a+(b-a)*n;
const shuffled = list => {
  const copy=[...list];
  for(let i=copy.length-1;i>0;i--){
    const j=Math.floor(rand(0,i+1));
    [copy[i],copy[j]]=[copy[j],copy[i]];
  }
  return copy;
};

function sunAt(time) {
  const loop=time%80;
  const end=SUN_PATH.findIndex(([t])=>t>loop);
  const [from,x]=SUN_PATH[end-1], [to,target]=SUN_PATH[end];
  const f=(loop-from)/(to-from);
  return WORLD.w*mix(x,target,f*f*(3-2*f));
}

function sunlit(p,time) {
  return Math.abs(p.x-sunAt(time))<LIGHT_WIDTH/2 &&
    !game.hazards.some(zone=>zone.kind==="shade" && zone.life>0 && distance(zone,p)<zone.r);
}

function resetInput() { held.clear(); touch=null; }

function fit() {
  const {width,height}=canvas.getBoundingClientRect();
  const px=Math.min(2,devicePixelRatio||1);
  if(width===view.w && height===view.h && px===view.px) return;
  const zoom=clamp(Math.min(width/780,height/540),.72,1.3);
  view={w:width,h:height,px,zoom};
  canvas.width=Math.round(width*px);
  canvas.height=Math.round(height*px);
}

function camera(p) {
  const w=view.w/view.zoom, h=view.h/view.zoom;
  return {x:clamp(p.x-w/2,0,Math.max(0,WORLD.w-w)),y:clamp(p.y-h/2,0,Math.max(0,WORLD.h-h)),w,h};
}

function add(tag,text,parent=content,className="") {
  const node=document.createElement(tag);
  node.textContent=text;
  if(className) node.className=className;
  parent.append(node);
  return node;
}

function button(text,activate,{parent=content,style="",detail=""}={}) {
  const node=add("button",text,parent,"button "+style);
  node.type="button";
  if(detail) add("small",detail,node);
  node.addEventListener("click",activate);
  return node;
}

  show("장비","gear");
  const gear=add("section","",content,"gear");
  const skillTitle=add("h3","스킬",gear);
  const skills=add("ul","",gear,"slots");
  const passiveTitle=add("h3","패시브",gear);
  const modules=add("ul","",gear,"slots passive-slots");
  skills.setAttribute("aria-label",skillTitle.textContent);
  modules.setAttribute("aria-label",passiveTitle.textContent);
  const detail=add("output","",gear,"gear-detail");
  renderEquipment(skills,modules,detail,game.weaponSlots,game.passiveSlots);
  button("닫기",closeGear,{style:"primary"}).focus();
}

function closeGear() {
  resume();
  if(compactLayout.matches) $("gearButton").focus({preventScroll:true});
}

const passiveLevel = id => game.passiveSlots[id]||0;
const bonus = id => passives[id].bonus[passiveLevel(id)-1]||0;
const capacity = () => [100,120,135,150][passiveLevel("starch")];
const nextXp = () => 5+Math.floor((game.level-1)*3.25)+Math.max(0,game.level-7)*5;
const weaponLabel = (key,w) => w.evolved?weapons[key].evolved:weapons[key].name;
const readyToEvolve = () => Object.entries(game.weaponSlots)
  .filter(([key,w])=>!w.evolved && w.level>=MAX_WEAPON_LEVEL && passiveLevel(weapons[key].passive)>0)
  .map(([key])=>key);

function chooseUpgrades() {
  const owned=Object.keys(game.weaponSlots);
  const haveSpace=Object.keys(game.passiveSlots).length<PASSIVE_SLOTS;
  const weaponCards=Object.keys(weapons)
    .filter(key=>game.weaponSlots[key]?game.weaponSlots[key].level<MAX_WEAPON_LEVEL:owned.length<WEAPON_SLOTS)
    .map(key=>({kind:"weapon",key}));
  const passiveCards=Object.entries(passives)
    .filter(([key,item])=>passiveLevel(key)<MAX_PASSIVE_LEVEL&&(passiveLevel(key)>0||haveSpace)&&(!item.weapon||owned.includes(item.weapon)))
    .map(([key])=>({kind:"passive",key}));
  const evolutionPairs=passiveCards.filter(({key})=>{
    const weapon=game.weaponSlots[weaponByPassive[key]];
    return weapon&&!weapon.evolved&&!passiveLevel(key);
  });
  const pending=game.pendingEvolutionPairs.find(key=>evolutionPairs.some(card=>card.key===key));
  let pair=evolutionPairs.find(card=>card.key===pending);
  if(!pair&&evolutionPairs.length&&Math.random()<EVOLUTION_PAIR_CHANCE) pair=shuffled(evolutionPairs)[0];
  const weaponUpgrades=weaponCards.filter(item=>owned.includes(item.key));
  const first=weaponUpgrades.find(item=>item.key==="leaf")||shuffled(weaponUpgrades)[0];
  const second=pair||shuffled(passiveCards.filter(item=>passiveLevel(item.key)))[0];
  const preferred=[first,second].filter(Boolean);
  const other=shuffled([...weaponCards,...passiveCards.filter(card=>!evolutionPairs.includes(card))])
    .filter(item=>!preferred.includes(item));
  const cards=[...preferred,...other].slice(0,3);
  if(cards.length<3) cards.push({kind:"training"});
  if(cards.length<3&&game.player.hp<TREE.maxHp) cards.push({kind:"heal"});
  return cards;
}

function levelUp() {
  game.xp-=nextXp();
  game.level++;
  if(game.level%2===0) quiz(false);
  else upgrade();
}

function upgrade() {
  show("레벨 "+game.level+" · 장비 선택","upgrade");
  const cards=chooseUpgrades();
  game.pendingEvolutionPairs=game.pendingEvolutionPairs.filter(key=>!cards.some(card=>card.kind==="passive"&&card.key===key));
  cards.forEach(({key,kind},i)=>{
    let title,detail;
    if(kind==="training"){
      title="공격력 강화";
      detail="모든 무기의 피해가 기본값의 5%만큼 늘어납니다.";
    } else if(kind==="heal"){
      title="정비 키트";
      detail="체력을 최대 28 회복합니다.";
    } else {
      const isWeapon=kind==="weapon";
      const item=isWeapon?weapons[key]:passives[key];
      const level=isWeapon?(game.weaponSlots[key]?.level||0):passiveLevel(key);
      title=item.name+" · Lv. "+(level+1);
      if(isWeapon){
        let effect=level===0?item.detail:"공격 피해 증가 · 공격 간격 단축";
        if(key==="leaf" && level>0){
          const current=LEAF_LEVEL_STATS[level-1], next=LEAF_LEVEL_STATS[level];
          effect=`잎 ${current.count} → ${next.count}장 · 기본 반경 ${current.radius} → ${next.radius} · 회전 속도 ${current.rotationPercent}% → ${next.rotationPercent}% · 피해 증가`;
        }
        detail=effect+" · 진화 짝 "+passives[item.passive].name;
      } else {
        const weapon=weapons[weaponByPassive[key]];
        detail=item.detail[level]+(weapon?` · ${weapon.name}의 진화 재료`:"");
      }
    }
    const choice=button(title,()=>{
      if(state!=="upgrade") return;
      if(kind==="training"){game.training++;resume();return;}
      if(kind==="heal"){game.player.hp=Math.min(TREE.maxHp,game.player.hp+28);resume();return;}
      equip(kind,key);
    },{style:"choose",detail});
    if(i===0) choice.focus();
  });
}


function equip(kind,key) {
  if(kind==="weapon"){
    const owned=game.weaponSlots[key];
    if(owned) owned.level++;
    else {
      game.weaponSlots[key]={level:1,evolved:false,next:game.time+.15};
      const pair=weapons[key].passive;
      if(!passiveLevel(pair)&&Object.keys(game.passiveSlots).length<PASSIVE_SLOTS) game.pendingEvolutionPairs.push(pair);
    }
  } else {
    game.passiveSlots[key]=passiveLevel(key)+1;
    game.player.fuel=Math.min(game.player.fuel,capacity());
  }
  resume();
}

function evolve(keys) {
  show("연구 상자 · 무기 진화","evolve");
  keys.forEach((key,i)=>{
    const item=weapons[key];
    const card=button(item.name+" → "+item.evolved,()=>{
      if(state!=="evolve" || !game.chests || !readyToEvolve().includes(key)) return;
      game.chests--;
      game.weaponSlots[key].evolved=true;
      game.weaponSlots[key].next=game.time;
      const p=game.player;
      const color=ATTACK_COLOR[key==="leaf"?"solar":key];
      pulse(p,132,color,3,"evolution");
      sparks(p,color,36,true);
      numberAt(p.x,p.y-47,item.evolved,color);
      resume();
    },{style:"choose",detail:item.evolution});
    if(i===0) card.focus();
  });
}

function quiz(atRoundEnd) {
  const q=(atRoundEnd?game.roundQuestions:game.levelQuestions).pop();
  const proceed=atRoundEnd?advanceRound:upgrade;
  const finalQuestion=atRoundEnd&&game.round===ROUND_COUNT;
  if(!q){proceed();return;}
  const title=atRoundEnd?"라운드 "+game.round:"레벨 "+game.level;
  show(title+" · "+q.title,"quiz");
  add("p",q.text);
  if(q.table){
    const table=add("table","",content,"quiz-data");
    add("caption","수업용 가상 자료",table);
    const head=add("tr","",add("thead","",table));
    for(const label of q.table.head) add("th",label,head).setAttribute("scope","col");
    const body=add("tbody","",table);
    for(const [label,...values] of q.table.rows){
      const row=add("tr","",body);
      add("th",label,row).setAttribute("scope","row");
      for(const value of values) add("td",value,row);
    }
  }
  const cards=shuffled(q.options.map((text,index)=>({text,index}))).map(({text,index},position)=>{
    const key=String(position+1);
    const node=button(`${key}. ${text}`,()=>answer(index),{style:"choose"});
    node.dataset.quizKey=key;
    node.setAttribute("aria-keyshortcuts",key);
    return {index,node};
  });
  cards[0].node.focus();
  function answer(index) {
    if(state!=="quiz") return;
    state="reviewing";
    const correct=index===q.right;
    game.results.push(correct);
    cards.forEach(({index:i,node})=>{
      node.disabled=true;
      if(i===q.right || i===index) node.dataset.answer=String(i===q.right);
    });
    if(!correct&&!finalQuestion){
      game.outputReducedUntil=game.time+QUIZ_PENALTY_SECONDS;
      const penalty=add("p","출력 저하 · 전투 15초 동안 무기 피해 −15%");
      penalty.id="penalty";
    }
    const feedback=add("p","");
    add("strong",correct?"정답. ":"정답은 "+q.options[q.right]+"입니다. ",feedback);
    feedback.append(document.createTextNode(q.explain));
    paintHud(true);
    const label=finalQuestion?"결과 보기":atRoundEnd?"다음 라운드":"장비 선택";
    button(label,()=>{if(state==="reviewing") proceed();},{style:"primary"}).focus();
  }
}

function advanceRound() {
  if(game.round===ROUND_COUNT){
    if(game.finalBossDown) game.roundsCleared=ROUND_COUNT;
    finish(game.finalBossDown);
    return;
  }
  game.roundsCleared=game.round;
  game.round++;
  resume();
}

function finish(clear) {
  show(clear?"3라운드 클리어":"온실 방어 종료","result");
  add("p",clear?"차광 통제기를 멈추고 세 라운드를 마쳤습니다."
    :game.player.hp<=0?"체력을 모두 소진했습니다."
    :"제한 시간 안에 차광 통제기를 멈추지 못했습니다.");
  add("p","생존 "+format(Math.floor(game.time))+" · 라운드 "+game.roundsCleared+" / "+ROUND_COUNT);
  add("p","드론 "+game.kills+"대 · 데이터 칩 "+game.chips);
  if(game.results.length) add("p","과학 문제 "+game.results.filter(Boolean).length+" / "+game.results.length);
  if(game.blocks) add("p","잎으로 막은 투사체 "+game.blocks+"발");
  button("다시 도전",start,{style:"primary"}).focus();
}


const format = seconds => Math.floor(seconds/60)+":"+String(seconds%60).padStart(2,"0");
function setBar(id,value,maximum) {
  const bar=$(id);
  bar.setAttribute("aria-valuemax",maximum);
  bar.setAttribute("aria-valuenow",value);
  bar.firstElementChild.style.width=(100*value/maximum)+"%";
}

function renderEquipment(skills,modules,detail,ownedWeapons,ownedPassives){
  const firstSkill=slots(skills,Object.entries(ownedWeapons),true,detail);
  const firstPassive=slots(modules,Object.entries(ownedPassives),false,detail);
  detail.replaceChildren();
  (firstSkill??firstPassive)?.();
}

function slots(list,items,isWeapon,detail){
  const length=isWeapon?WEAPON_SLOTS:PASSIVE_SLOTS;
  const maxLevel=isWeapon?MAX_WEAPON_LEVEL:MAX_PASSIVE_LEVEL;
  let showFirst;
  list.replaceChildren();
  items.forEach(([key,entry])=>{
    const level=isWeapon?entry.level:entry;
    const evolved=isWeapon&&entry.evolved;
    const name=isWeapon?weaponLabel(key,entry):passives[key].name;
    const weapon=isWeapon?weapons[key]:weapons[weaponByPassive[key]];
    const effect=isWeapon?(evolved?weapon.evolution:weapon.detail):passives[key].detail[level-1];
    const pair=isWeapon?(evolved?"진화 완료":`진화 짝 ${passives[weapon.passive].name}`):weapon?`${weapon.name}의 진화 재료`:"";
    const describe=()=>{
      detail.replaceChildren();
      add("strong",name,detail);
      add("span",[effect,pair].filter(Boolean).join(" · "),detail);
    };
    showFirst??=describe;

    const tile=add("li","",list,"slot");
    const slot=add("button","",tile,evolved?"slot-button evolved":"slot-button");
    slot.type="button";
    slot.setAttribute("aria-label",`${name}, 현재 레벨 ${level}, 최대 레벨 ${maxLevel}${evolved?", 진화":""}`);
    const icon=add("span","",slot,"item-icon");
    const [x,y]=ITEM_ICON_POSITIONS[key];
    icon.style.backgroundImage=`url(${ITEM_ICON_IMAGE})`;
    icon.style.backgroundPosition=`${x*25}% ${y*20}%`;
    icon.setAttribute("aria-hidden","true");
    const dots=add("span","",slot,"slot-dots");
    dots.setAttribute("aria-hidden","true");
    for(let n=0;n<maxLevel;n++) add("i","",dots,n<level?"filled":"");
    slot.addEventListener("focus",describe);
    slot.addEventListener("pointerenter",describe);
    slot.addEventListener("click",describe);
  });
  for(let n=items.length;n<length;n++) add("li","",list,"slot").setAttribute("aria-label","빈 슬롯");
  return showFirst;
}

function paintHud(force=false) {
  if(!game) return;
  const p=game.player;
  const clock=Math.ceil(Math.max(0,game.round*ROUND_SECONDS-game.time));
  const reduced=Math.ceil(Math.max(0,game.outputReducedUntil-game.time));
  const boss=game.boss?.hp>0?game.boss:null;
  const cs=Object.entries(game.weaponSlots);
  const ps=Object.entries(game.passiveSlots);
  const loadout=JSON.stringify([cs.map(([key,w])=>[key,w.level,w.evolved]),ps]);
  const key=[state,Math.ceil(p.hp),Math.floor(p.fuel),capacity(),game.round,clock,reduced,game.level,game.xp,game.chips,game.chests,game.training,boss?.hp,loadout].join("|");
  if(key===hudMemo && !force) return;
  hudMemo=key;
  $("clock").textContent=format(clock);
  $("phase").textContent="라운드 "+game.round+" / "+ROUND_COUNT;
  $("quizStatus").hidden=!reduced;
  $("quizStatus").textContent=reduced?`출력 저하 ${reduced}초`:"";
  $("healthText").textContent=Math.ceil(p.hp)+" / "+TREE.maxHp;
  $("fuelText").textContent=Math.floor(p.fuel)+" / "+capacity();
  $("level").textContent="Lv. "+game.level;
  $("chipText").textContent="칩 "+game.chips;
  $("loot").textContent="연구 상자 "+game.chests+"개";
  $("training").hidden=!game.training;
  $("training").textContent=game.training?"공격력 +"+game.training*5+"%":"";
  setBar("healthBar",Math.ceil(p.hp),TREE.maxHp);
  setBar("fuelBar",Math.floor(p.fuel),capacity());
  setBar("xpBar",Math.min(game.xp,nextXp()),nextXp());
  $("bossBar").hidden=!boss;
  if(boss){
    $("bossName").textContent=enemyTypes[boss.type].title;
    setBar("bossHealth",Math.ceil(boss.hp),boss.max);
  }
  if(game.lastLoadout!==loadout){
    game.lastLoadout=loadout;
    renderEquipment($("weapons"),$("passives"),$("gearDetail"),game.weaponSlots,game.passiveSlots);
  }
}

function movePlayer(time) {
  const p=game.player;
  const dx=Number(held.has("d"))-Number(held.has("a"));
  const dy=Number(held.has("s"))-Number(held.has("w"));
  const x=dx||dy?dx:touch?.dx||0, y=dx||dy?dy:touch?.dy||0;
  const moving=Math.hypot(x,y);
  if(moving>.02){
    const speed=TREE.speed*(1+[0,.08,.12,.16][passiveLevel("stride")]);
    p.x+=x/Math.max(1,moving)*speed*time;
    p.y+=y/Math.max(1,moving)*speed*time;
    p.moveAngle=Math.atan2(y,x);
    p.rootTime=0;
    p.walking+=time*5;
  } else {
    p.rootTime+=time;
    p.walking=0;
  }
  inBounds(p,24);
  p.rooted=p.rootTime>=[1.2,1,.8,.6][passiveLevel("roots")];
  p.lit=sunlit(p,game.time);
  p.hit=Math.max(0,p.hit-time);
  p.hp=Math.min(TREE.maxHp,p.hp+bonus("recovery")*time);
  const rootedBonus=[0,.25,.4,.55][passiveLevel("water")];
  const net=p.lit?(p.rooted?8*(1+rootedBonus):5):-1.55;
  const extraDrain=game.weaponSlots.leaf.evolved && p.fuel>0?4.4:0;
  p.fuel=clamp(p.fuel+(net-extraDrain)*time,0,capacity());
}


function addEffect(effect) {
  game.effects.push(effect);
  if(game.effects.length>EFFECT_LIMIT) game.effects.shift();
}

function battleRing(x,y,r,color,life=.45) {
  addEffect({kind:"ring",x,y,r,color,life,max:life});
}

function pulse(origin,r,color,bands,pattern="ripple") {
  const life=pattern==="evolution"?.85:.51;
  addEffect({kind:"pulse",x:origin.x,y:origin.y,r,color,bands,pattern,life,max:life});
}

function trace(points,color,style,strength=1) {
  const life=strength>1?.39:.30;
  addEffect({kind:"trace",points,color,style,strength,life,max:life});
}

function numberAt(x,y,text,color) {
  addEffect({kind:"number",x,y,text,color,life:.8,max:.8});
}

function sparks(origin,color,count,heavy=false) {
  const total=motion.matches?Math.min(count,4):count;
  const particles=game.particles;
  const phase=game.time*22+(origin.id??1)*1.61;
  for(let n=0;n<total;n++){
    const angle=phase+n*2.39996;
    const speed=(heavy?92:51)+(n%5)*19;
    const life=(heavy?.39:.19)+(n%4)*.045;
    particles.push({x:origin.x,y:origin.y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,
      size:(heavy?3:2)+n%3,color:n%4===0?"#fff5d7":color,life,max:life});
  }
  const extra=particles.length-PARTICLE_LIMIT;
  if(extra>0) particles.splice(0,extra);
}

function hurtPlayer(damage) {
  const p=game.player;
  if(p.hit>0 || p.hp<=0) return;
  const armor=p.rooted?[0,.10,.15,.20][passiveLevel("bark")]:0;
  p.hp=Math.max(0,p.hp-Math.round(damage*(1-armor)));
  p.hit=.85;
  battleRing(p.x,p.y,30,PALETTE.red,.28);
}

function hurtEnemy(enemy,damage,color=ATTACK_COLOR.leaf) {
  if(enemy.hp<=0) return;
  const output=game.time<game.outputReducedUntil?QUIZ_DAMAGE_MULTIPLIER:1;
  const dealt=damage*(1+game.training*.05)*(1+bonus("amplifier"))*output;
  enemy.hp=Math.max(0,enemy.hp-dealt);
  enemy.flash=motion.matches?.06:.11;
  enemy.flashColor=color;
  numberAt(enemy.x+((enemy.id??1)%3-1)*7,enemy.y-enemy.r-5,String(Math.round(dealt)),color);
  sparks(enemy,color,enemy.hp?4:9,!enemy.hp);
  if(enemy.hp) return;
  game.kills++;
  battleRing(enemy.x,enemy.y,enemy.r*2.1,enemy.color,.33);
  if(enemy.type==="shade"||enemy.type==="final") pulse(enemy,enemy.r*4,color,3);
  if(enemy.type==="final") game.finalBossDown=true;
  game.drops.push({kind:"chip",x:enemy.x,y:enemy.y,value:enemy.xp});
  if(enemy.type==="shade"||enemy.type==="final") game.drops.push({kind:"chest",x:enemy.x+16,y:enemy.y+9});
}

function collect(dt) {
  const p=game.player;
  const range=TREE.pickup*(1+[0,.20,.35,.50][passiveLevel("magnet")]);
  game.drops=game.drops.filter(loot=>{
    const d=distance(loot,p);
    if(d<=16){
      if(loot.kind==="chest"){
        game.chests++;
        numberAt(p.x,p.y-23,"연구 상자",PALETTE.sun);
      } else {
        game.xp+=loot.value*(1+bonus("analyzer"));
        game.chips+=loot.value;
        numberAt(p.x+rand(-16,16),p.y-16,"+"+loot.value,chipColor(loot.value));
      }
      return false;
    }
    if(d<=range){
      const speed=160+(range-d)*.55;
      const step=Math.min(d,speed*dt);
      loot.x+=(p.x-loot.x)/d*step;
      loot.y+=(p.y-loot.y)/d*step;
    }
    return true;
  });
}

function enemyHealthMultiplier(time) {
  const first=ENEMY_HEALTH_CURVE[0];
  if(time<=first[0]) return first[1];
  const next=ENEMY_HEALTH_CURVE.findIndex(([seconds])=>time<=seconds);
  if(next<0) return ENEMY_HEALTH_CURVE.at(-1)[1];
  const [from,low]=ENEMY_HEALTH_CURVE[next-1], [to,high]=ENEMY_HEALTH_CURVE[next];
  return mix(low,high,(time-from)/(to-from));
}

function spawn(type,close=false) {
  const p=game.player;
  const c=camera(p);
  const base=enemyTypes[type];
  const angle=rand(0,TAU);
  const dist=close?rand(188,240):clamp(Math.min(c.w,c.h)/2+60,235,385);
  const start=movePoint(p,angle,dist);
  inBounds(start,24);
  const scale=type==="final"?1:enemyHealthMultiplier(game.time);
  const hp=Math.round(base.hp*scale);
  const item={
    ...base,type,x:start.x,y:start.y,id:++game.spawnId,hp,max:hp,face:angle+Math.PI,
    flash:0,slowed:0,held:0,leafAt:0,outerAt:0,fireAt:game.time+rand(2,4),
    windup:null,dashLeft:0
  };
  if(type==="final") game.boss=item;
  game.enemies.push(item);
  if(type==="shade" || type==="final") battleRing(item.x,item.y,item.r*2.4,item.color,.65);
}

function spawnWave() {
  const roll=Math.random();
  if(game.round===1){
    const shooters=game.enemies.filter(e=>e.type==="shot"&&e.hp>0).length;
    spawn(game.time>=48&&shooters<2&&roll<.19?"shot":game.time>=57&&roll<.27?"dash":"scout");
    return;
  }
  const heavy=game.round===3?.68:.49;
  spawn(roll<.17?"shot":roll<.33?"dash":roll<heavy?"armor":"scout");
}

function timeline() {
  const events=[
    [39,"first-shot",()=>spawn("shot",true)],
    [61,"first-elite",()=>spawn("shade",true)],
    [134,"second-elite",()=>spawn("shade",true)],
    [201,"third-elite",()=>spawn("shade",true)],
    [220,"final-boss",()=>spawn("final",true)]
  ];
  for(const [at,id,action] of events){
    if(game.time>=at&&!game.events.has(id)){game.events.add(id);action();}
  }
}


function beginEnemyTell(enemy,d) {
  const t=game.time;
  if(enemy.windup || enemy.fireAt>t || enemy.dashLeft>0) return;
  const angle=heading(enemy,game.player);
  if(enemy.type==="shot" && d<=248) enemy.windup={kind:"shot",ends:t+1.65,angle};
  else if(enemy.type==="dash" && d<=124) enemy.windup={kind:"dash",ends:t+1.05,angle};
  else if(enemy.type==="shade" && d<=184) enemy.windup={kind:"shade",ends:t+2.1,x:game.player.x,y:game.player.y,r:36};
  else if(enemy.type==="final" && d<=264) {
    enemy.windup={kind:"boss",ends:t+2.1,angle,r:75};
  }
}

function fireEnemy(enemy,tell) {
  const t=game.time;
  enemy.windup=null;
  if(tell.kind==="shot"){
    const point=movePoint(enemy,tell.angle,enemy.r+6);
    game.shots.push({...point,angle:tell.angle,speed:93,life:4.5,damage:game.round===3?8:6});
    enemy.fireAt=t+rand(5.6,7.3);
  } else if(tell.kind==="dash"){
    enemy.dashLeft=.67;
    enemy.face=tell.angle;
    enemy.fireAt=t+4;
  } else if(tell.kind==="shade"){
    game.hazards.push({kind:"shade",x:tell.x,y:tell.y,r:tell.r,life:9,max:9});
    enemy.fireAt=t+14;
  } else {
    const angles=[-.48,-.24,0,.24,.48];
    for(const offset of angles){
      const angle=tell.angle+offset;
      const point=movePoint(enemy,angle,enemy.r+7);
      game.shots.push({...point,angle,speed:100,life:4.6,damage:11});
    }
    battleRing(enemy.x,enemy.y,tell.r,PALETTE.red,.45);
    if(distance(enemy,game.player)<tell.r) hurtPlayer(enemy.damage);
    enemy.fireAt=t+6.3;
  }
}

function moveEnemies(dt) {
  const p=game.player;
  for(const e of game.enemies){
    if(e.hp<=0) continue;
    e.flash=Math.max(0,e.flash-dt);
    e.slowed=Math.max(0,e.slowed-dt);
    e.held=Math.max(0,e.held-dt);
    const dist=distance(p,e);
    beginEnemyTell(e,dist);
    if(e.windup){
      if(game.time>=e.windup.ends) fireEnemy(e,e.windup);
    } else if(e.dashLeft>0){
      e.dashLeft-=dt;
      e.x+=Math.cos(e.face)*172*dt;
      e.y+=Math.sin(e.face)*172*dt;
    } else if(e.held<=0){
      e.face=heading(e,p);
      const stop=e.type==="shot"?84:(e.type==="shade"?47:TREE.hitRadius+e.r-2);
      if(dist>stop){
        const step=Math.min(dist-stop,e.speed*(e.slowed?.45:1)*dt);
        e.x+=Math.cos(e.face)*step;
        e.y+=Math.sin(e.face)*step;
      }
    }
    inBounds(e,e.r+1);
    if(distance(p,e)<TREE.hitRadius+e.r) hurtPlayer(e.damage);
  }
}

function leaves() {
  const p=game.player, weapon=game.weaponSlots.leaf;
  const stats=LEAF_LEVEL_STATS[weapon.level-1];
  const reach=1+bonus("lens");
  const radius=stats.radius*(p.rooted?1.15:1)*(p.rooted&&p.lit?1.2:1);
  const ring=(count,spread,phase,outer)=>Array.from({length:count},(_,i)=>{
    const angle=phase+i*TAU/count;
    return {...movePoint(p,angle,spread),angle,outer};
  });
  return [
    ...ring(stats.count,radius*reach,p.angle,false),
    ...(weapon.evolved && p.fuel>0?ring(5,(radius+57)*reach,-p.angle*.75,true):[])
  ];
}

function orbitStrike(points) {
  const t=game.time, level=game.weaponSlots.leaf.level;
  const interval=1-bonus("cooling");
  for(const e of game.enemies){
    if(e.hp<=0) continue;
    for(const point of points){
      const slot=point.outer?"outerAt":"leafAt";
      if(t<e[slot] || distance(e,point)>e.r+(point.outer?16:17)) continue;
      e[slot]=t+(point.outer?.56:.46)*interval;
      hurtEnemy(e,point.outer?41:22+(level-1)*6,ATTACK_COLOR[point.outer?"solar":"leaf"]);
      if(e.hp<=0) break;
    }
  }
}

function flyShots(dt,points) {
  const p=game.player;
  game.shots=game.shots.filter(shot=>{
    shot.life-=dt;
    if(shot.life<=0) return false;
    const moved=movePoint(shot,shot.angle,shot.speed*dt);
    shot.x=moved.x;
    shot.y=moved.y;
    if(points.some(point=>distance(point,shot)<21)){
      game.blocks++;
      battleRing(shot.x,shot.y,21,ATTACK_COLOR.leaf,.28);
      sparks(shot,ATTACK_COLOR.leaf,7);
      return false;
    }
    if(distance(p,shot)<TREE.hitRadius+4){
      hurtPlayer(shot.damage);
      return false;
    }
    return shot.x>=0&&shot.x<=WORLD.w&&shot.y>=0&&shot.y<=WORLD.h;
  });
}

function nearest(from,range,config={}) {
  let target=null;
  let best=range;
  for(const e of game.enemies){
    if(e.hp<=0 || config.excluded?.has(e.id)) continue;
    const d=distance(from,e);
    if(d>=best) continue;
    best=d;
    target=e;
  }
  return target;
}

function push(enemy,angle,amount) {
  Object.assign(enemy,movePoint(enemy,angle,amount));
  inBounds(enemy,enemy.r+1);
}

function dotDistance(a,b,e) {
  const vx=b.x-a.x,vy=b.y-a.y;
  const factor=clamp(((e.x-a.x)*vx+(e.y-a.y)*vy)/(vx*vx+vy*vy||1),0,1);
  return Math.hypot(e.x-(a.x+vx*factor),e.y-(a.y+vy*factor));
}

function boltPath(points) {
  const path=[{x:points[0].x,y:points[0].y}];
  for(let i=1;i<points.length;i++){
    const start=points[i-1], end=points[i];
    const angle=heading(start,end), length=distance(start,end);
    const steps=Math.max(1,Math.ceil(length/23));
    for(let step=1;step<steps;step++){
      const point=movePoint(start,angle,length*step/steps);
      const offset=(step%2?1:-1)*(5+(step*7+i)%8);
      path.push(movePoint(point,angle+Math.PI/2,offset));
    }
    path.push({x:end.x,y:end.y});
  }
  return path;
}

function optics(p,angle,length,remaining,damage,evolved) {
  let position={x:p.x,y:p.y}, dx=Math.cos(angle), dy=Math.sin(angle);
  const points=[position], hit=new Set();
  while(length>1 && remaining>=0){
    const sx=dx>0?(WORLD.w-12-position.x)/dx:dx<0?(12-position.x)/dx:Infinity;
    const sy=dy>0?(WORLD.h-12-position.y)/dy:dy<0?(12-position.y)/dy:Infinity;
    const step=Math.max(0,Math.min(sx,sy,length));
    const end={x:position.x+dx*step,y:position.y+dy*step};
    points.push(end);
    for(const e of game.enemies){
      if(e.hp>0&&!hit.has(e.id)&&dotDistance(position,end,e)<e.r+5){
        hit.add(e.id);
        hurtEnemy(e,damage,ATTACK_COLOR.beam);
      }
    }
    if(step>=length) break;
    position=end;
    if(sx<=sy) dx=-dx;
    if(sy<=sx) dy=-dy;
    length-=step;
    remaining--;
  }
  trace(points,ATTACK_COLOR.beam,"beam",evolved?1.65:1);
  for(const reflection of points.slice(1,-1)) sparks(reflection,ATTACK_COLOR.beam,7);
}

function useWeapon(key,w) {
  const p=game.player,t=game.time;
  const damage=16+w.level*8;
  const reach=1+bonus("lens");
  const color=ATTACK_COLOR[key];
  const angleTo=e=>heading(p,e);
  const all=game.enemies.filter(enemy=>enemy.hp>0);
  if(key==="coil"){
    const radius=(w.evolved?202:107+w.level*12)*(1+bonus("iron"))*reach;
    const targets=all.filter(e=>distance(p,e)<radius);
    if(!targets.length) return false;
    pulse(p,radius,color,w.evolved?4:2,"magnet");
    for(const e of targets.slice(0,5)) trace([e,p].map(({x,y})=>({x,y})),color,"field");
    for(const e of targets){
      const factor=e.type==="final"?.30:1;
      push(e,heading(e,p),Math.max(0,Math.min(distance(p,e)-31,w.evolved?58:28))*factor);
      if(w.evolved) e.held=.65;
      hurtEnemy(e,damage*(w.evolved?1.38:.80),color);
    }
  } else if(key==="beam"){
    const target=nearest(p,590*reach);
    if(!target) return false;
    optics(p,angleTo(target),(w.evolved?1010:450+w.level*60)*(1+bonus("mirror"))*reach,w.evolved?3:1,damage*(w.evolved?1.6:1),w.evolved);
  } else if(key==="spring"){
    const primary=nearest(p,(w.evolved?132:86+w.level*6)*reach);
    if(!primary) return false;
    const angle=angleTo(primary);
    const from={x:primary.x,y:primary.y};
    push(primary,angle,(w.evolved?103:55)*(1+bonus("elastic")));
    trace([{x:p.x,y:p.y},from,{x:primary.x,y:primary.y}],color,"impact",w.evolved?1.6:1);
    pulse(from,w.evolved?53:32,color,w.evolved?3:2);
    if(w.evolved){
      for(const e of all){
        if(e!==primary && dotDistance(from,primary,e)<e.r+primary.r){
          hurtEnemy(e,damage*1.35,color);
          push(e,angle,25);
        }
      }
    }
    hurtEnemy(primary,damage*1.45,color);
  } else if(key==="ice"){
    const target=nearest(p,220*reach);
    if(!target) return false;
    const center=movePoint(p,angleTo(target),Math.min(120*reach,distance(p,target)));
    const radius=(w.evolved?97:55+w.level*5)*reach;
    const duration=(w.evolved?5:1.7)*(1+bonus("plate"));
    pulse(center,radius,color,w.evolved?3:2,"frost");
    sparks(center,color,w.evolved?18:10,true);
    if(w.evolved) game.hazards.push({kind:"ice",...center,r:radius,life:duration,max:duration,damage:damage*.52,next:t+.38});
    for(const e of all){
      if(distance(center,e)<=radius){
        e.slowed=Math.max(e.slowed,duration);
        hurtEnemy(e,damage,color);
      }
    }
  } else if(key==="sound"){
    const radius=(w.evolved?214:92+w.level*12)*reach;
    const targets=all.filter(e=>distance(p,e)<radius);
    if(!targets.length) return false;
    pulse(p,radius,color,w.evolved?5:3,"sound");
    for(const e of targets){
      const tuned=w.evolved&&(e.type==="shot"||e.type==="armor");
      hurtEnemy(e,damage*(1+bonus("frequency"))*(tuned?2.4:1),color);
    }
  } else if(key==="air"){
    const range=(w.evolved?395:174+w.level*13)*(1+bonus("tank"))*reach;
    const target=nearest(p,range);
    if(!target) return false;
    const angle=angleTo(target);
    if(w.evolved){
      game.waves.push({x:p.x,y:p.y,dir:angle,left:range,damage:damage*1.28,hit:new Set()});
    } else {
      const end=movePoint(p,angle,range);
      trace([{x:p.x,y:p.y},end],color,"gust");
      for(const e of all){
        const forward=(e.x-p.x)*Math.cos(angle)+(e.y-p.y)*Math.sin(angle);
        if(forward>0 && dotDistance(p,end,e)<32+e.r){
          push(e,angle,54);
          hurtEnemy(e,damage*.92,color);
        }
      }
    }
  } else if(key==="spark"){
    const chain=[],hit=new Set();
    let from=p;
    for(let n=0;n<(w.evolved?5:1);n++){
      const e=nearest(from,(n===0?195:139)*reach,{excluded:hit});
      if(!e) break;
      chain.push({x:e.x,y:e.y});
      hit.add(e.id);
      from=e;
      hurtEnemy(e,damage*(1+bonus("capacitor"))*(n===0?1.25:1),color);
    }
    if(!chain.length) return false;
    trace(boltPath([p,...chain]),color,"bolt",w.evolved?1.55:1);
  }
  return true;
}

function fireLoadout() {
  const interval=1-bonus("cooling");
  for(const [key,w] of Object.entries(game.weaponSlots)){
    if(key==="leaf" || w.next>game.time) continue;
    w.next=game.time+(useWeapon(key,w)?Math.max(.8,2.65-w.level*.27-(w.evolved?.37:0))*interval:.23);
  }
}

function circlesAndWaves(dt) {
  game.hazards=game.hazards.filter(zone=>{
    zone.life-=dt;
    if(zone.kind==="ice" && game.time>=zone.next){
      zone.next+=.55;
      for(const e of game.enemies){
        if(distance(zone,e)<=zone.r){
          e.slowed=Math.max(e.slowed,.64);
          hurtEnemy(e,zone.damage,ATTACK_COLOR.ice);
        }
      }
    }
    return zone.life>0;
  });
  game.waves=game.waves.filter(wave=>{
    const step=245*dt;
    Object.assign(wave,movePoint(wave,wave.dir,step));
    wave.left-=step;
    for(const e of game.enemies){
      if(e.hp<=0 || wave.hit.has(e.id) || distance(e,wave)>e.r+41) continue;
      wave.hit.add(e.id);
      push(e,wave.dir,49);
      hurtEnemy(e,wave.damage,ATTACK_COLOR.air);
    }
    return wave.left>0;
  });
  game.effects=game.effects.filter(effect=>{
    if(effect.kind==="number") effect.y-=dt*29;
    return (effect.life-=dt)>0;
  });
  game.particles=game.particles.filter(particle=>{
    particle.x+=particle.vx*dt;
    particle.y+=particle.vy*dt;
    particle.vy+=95*dt;
    return (particle.life-=dt)>0;
  });
}

function tick(dt) {
  const end=game.round*ROUND_SECONDS;
  game.time=Math.min(end,game.time+dt);
  if(game.time>=end){quiz(true);return;}

  timeline();
  if(game.time>=game.spawnAt){
    if(game.enemies.length<105) spawnWave();
    const base=game.time<22?1.08:[.86,.71,.62][game.round-1];
    game.spawnAt=game.time+base*rand(.84,1.16);
  }
  movePlayer(dt);
  // 네 바퀴마다 초기화하면 3/4 속도로 역회전하는 바깥 잎도 같은 위상으로 이어진다.
  const rotation=LEAF_LEVEL_STATS[game.weaponSlots.leaf.level-1].rotationPercent/100;
  game.player.angle=(game.player.angle+LEAF_BASE_ANGULAR_SPEED*rotation*dt)%(TAU*4);
  moveEnemies(dt);
  const orbit=leaves();
  orbitStrike(orbit);
  fireLoadout();
  flyShots(dt,orbit);
  circlesAndWaves(dt);
  game.enemies=game.enemies.filter(e=>e.hp>0);
  collect(dt);
  if(game.player.hp<=0){finish(false);return;}
  if(game.xp>=nextXp()){levelUp();return;}
  const ready=game.chests>0?readyToEvolve():[];
  if(ready.length){evolve(ready);return;}
  paintHud();
}


function circle(x,y,r) {
  paint.beginPath();
  paint.arc(x,y,r,0,TAU);
}

function line(points,color,width=1) {
  paint.strokeStyle=color;
  paint.lineWidth=width;
  paint.beginPath();
  paint.moveTo(points[0].x,points[0].y);
  for(const p of points.slice(1)) paint.lineTo(p.x,p.y);
  paint.stroke();
}

function outlinedCircle(p,r,color,width=1) {
  circle(p.x,p.y,r);
  paint.strokeStyle=color;
  paint.lineWidth=width;
  paint.stroke();
}

function scene(c,time) {
  paint.fillStyle="#293d31";
  paint.fillRect(c.x,c.y,c.w,c.h);
  const tile=48;
  const x0=Math.floor(c.x/tile)*tile,y0=Math.floor(c.y/tile)*tile;
  for(let y=y0;y<c.y+c.h;y+=tile) for(let x=x0;x<c.x+c.w;x+=tile){
    const code=(x/tile*83+y/tile*137)%7;
    paint.fillStyle=["#2a4033","#2e4537","#2b4236","#2a3e34","#2d4135","#2e4439","#2c4034"][Math.abs(code)];
    paint.fillRect(x+1,y+1,tile-2,tile-2);
    paint.fillStyle="#9cc4a426";
    paint.fillRect(x+7,y+8,3,2);
    paint.fillRect(x+35,y+33,2,2);
  }

  paint.strokeStyle="#9daa8465";
  paint.lineWidth=4;
  paint.strokeRect(11,11,WORLD.w-22,WORLD.h-22);
  paint.strokeStyle="#0e1d176c";
  paint.lineWidth=14;
  paint.strokeRect(25,25,WORLD.w-50,WORLD.h-50);
  for(let x=48;x<WORLD.w-48;x+=70){
    for(const y of [47,WORLD.h-73]){
      paint.fillStyle="#182f24";
      paint.fillRect(x-1,y+14,44,20);
      paint.fillStyle="#507259";
      paint.fillRect(x,y,42,29);
      paint.fillStyle="#384d32";
      paint.fillRect(x+4,y+4,34,18);
      paint.fillStyle="#8da556";
      paint.fillRect(x+9,y+4,8,13);
      paint.fillRect(x+23,y+8,12,10);
    }
  }

  drawLandmarks(c);
  const light=sunAt(time), left=light-LIGHT_WIDTH/2, next=sunAt(time+4);
  const warm=paint.createLinearGradient(left,0,left+LIGHT_WIDTH,0);
  warm.addColorStop(0,"#fde47d12"); warm.addColorStop(.13,"#fde47d29");
  warm.addColorStop(.5,"#fde47d42"); warm.addColorStop(.87,"#fde47d29"); warm.addColorStop(1,"#fde47d12");
  paint.fillStyle=warm;
  paint.fillRect(left,c.y,LIGHT_WIDTH,c.h);
  paint.strokeStyle="#f7d88072";
  paint.lineWidth=2;
  paint.strokeRect(left,19,LIGHT_WIDTH,WORLD.h-38);
  for(let a=left+42;a<left+LIGHT_WIDTH;a+=70){
    paint.fillStyle="#fff0a557";
    paint.fillRect(a,Math.floor(c.y/120)*120+51,3,3);
    paint.fillRect(a+11,Math.floor(c.y/120)*120+217,2,3);
    paint.fillRect(a-5,Math.floor(c.y/120)*120+405,2,2);
  }
  if(Math.abs(next-light)>28){
    paint.strokeStyle="#efdf9580";
    paint.lineWidth=2;
    paint.setLineDash([8,12]);
    paint.strokeRect(next-LIGHT_WIDTH/2,21,LIGHT_WIDTH,WORLD.h-42);
    paint.setLineDash([]);
  }

  const fade=Math.min(c.w,c.h)*.73;
  const shade=paint.createRadialGradient(c.x+c.w/2,c.y+c.h/2,fade*.45,c.x+c.w/2,c.y+c.h/2,fade);
  shade.addColorStop(0,"#10171200"); shade.addColorStop(1,"#101b15b0");
  paint.fillStyle=shade;
  paint.fillRect(c.x,c.y,c.w,c.h);
}


function drawLandmarks(c) {

    paint.fillStyle="#10251c";

      paint.fillStyle="#84c3d0";
      paint.fillRect(x-20,y-11,8,25);
      paint.fillStyle="#add7cd";

}

function treeAt(x,y,frame,scale,lit=true) {
  circle(x,y+scale*.27,scale*.33);
  paint.fillStyle="#10201abb";
  paint.fill();
  const sprite=$("sprite");
  if(!sprite.complete || !sprite.naturalWidth){
    paint.fillStyle=PALETTE.leaf;
    paint.fillRect(x-scale*.3,y-scale*.31,scale*.6,scale*.5);
    paint.fillStyle="#a27445";
    paint.fillRect(x-scale*.14,y+scale*.04,scale*.28,scale*.29);
    return;
  }
  paint.imageSmoothingEnabled=false;
  if(frame===3 && !lit) paint.filter="saturate(.62) brightness(.91)";
  paint.drawImage(sprite,frame*32,0,32,32,Math.round(x-scale/2),Math.round(y-scale*.56),scale,scale);
  paint.filter="none";
}

function drawDrone(e) {
  paint.save();
  paint.translate(Math.round(e.x),Math.round(e.y));
  circle(0,e.r*.25,e.r*1.02);
  paint.fillStyle="#101c20ad";
  paint.fill();
  paint.rotate(e.face||0);
  const r=e.r;
  const crown=e.type==="final";
  paint.strokeStyle=e.flash?e.flashColor:e.color;
  paint.lineWidth=e.flash?3.4:crown?3:1.7;
  paint.fillStyle=e.flash?"#f8f4dd":crown?"#694843":"#434b47";
  paint.beginPath();
  paint.moveTo(-.84*r,-.64*r);paint.lineTo(-.28*r,-r);paint.lineTo(.58*r,-.83*r);
  paint.lineTo(1.17*r,0);paint.lineTo(.58*r,.83*r);paint.lineTo(-.28*r,r);
  paint.lineTo(-.84*r,.64*r);paint.closePath();
  paint.fill();
  paint.stroke();
  paint.fillStyle=e.color;
  paint.fillRect(-.08*r,-.38*r,r*.50,r*.76);
  paint.fillStyle="#272928";
  paint.fillRect(.23*r,-.17*r,r*.22,r*.34);
  if(e.type==="shot"||crown) paint.fillRect(.6*r,-.16*r,r*.84,r*.32);
  if(e.type==="armor"||e.type==="shade"||crown){
    paint.fillStyle=e.type==="shade"?"#a79add":"#b9a589";
    paint.fillRect(-.62*r,-1.14*r,r*.65,r*.28);
    paint.fillRect(-.62*r,.86*r,r*.65,r*.28);
  }
  paint.restore();
  if(game?.weaponSlots.sound?.evolved && (e.type==="shot"||e.type==="armor")){
    paint.fillStyle="#fab6e9";
    paint.fillRect(e.x-3,e.y-r-10,6,4);
  }
}

function drawTell(e) {
  if(!e.windup) return;
  const t=e.windup;
  paint.setLineDash([7,6]);
  if(t.kind==="shade"){
    circle(t.x,t.y,t.r);
    paint.fillStyle="#9f79ee41";paint.fill();
    outlinedCircle(t,t.r,"#ceadf5",2);
  } else if(t.kind==="boss"){
    outlinedCircle(e,t.r,PALETTE.red,2);
    for(const a of [-.48,-.24,0,.24,.48]){
      line([e,movePoint(e,t.angle+a,282)],"#ffaf8b75",2);
    }
  } else {
    line([e,movePoint(e,t.angle,t.kind==="dash"?119:330)],t.kind==="dash"?"#ff9f8e":"#f5caa7",2);
  }
  paint.setLineDash([]);
}

const chipColor = value => value>=12?"#ffe080":value>=6?"#c8a7ff":value>=3?"#a0e6ff":"#c1e576";

function drawLoot(loot) {
  if(loot.kind==="chest"){
    paint.fillStyle="#392b22";paint.fillRect(loot.x-11,loot.y-7,22,14);
    paint.strokeStyle="#ffe08d";paint.lineWidth=1.5;paint.strokeRect(loot.x-11,loot.y-7,22,14);
    paint.fillStyle="#ffe08d";paint.fillRect(loot.x-2,loot.y-2,4,5);
    return;
  }
  const s=loot.value>=12?9:loot.value>=6?7:loot.value>=3?5:4;
  paint.fillStyle=chipColor(loot.value);
  paint.beginPath();
  paint.moveTo(loot.x,loot.y-s);
  paint.lineTo(loot.x+s,loot.y);
  paint.lineTo(loot.x,loot.y+s);
  paint.lineTo(loot.x-s,loot.y);
  paint.closePath();paint.fill();
  paint.fillStyle="#fff5d5";
  paint.fillRect(loot.x-1,loot.y-2,2,2);
}

function drawWind(origin,angle,color,opacity) {
  paint.save();
  paint.translate(origin.x,origin.y);
  paint.rotate(angle);
  for(let i=0;i<3;i++){
    paint.globalAlpha=opacity*(1-i*.26);
    paint.strokeStyle=i===0?"#d5fff1":color;
    paint.lineWidth=3.3-i*.55;
    paint.beginPath();
    paint.ellipse(-i*17,0,14+i*3,30+i*7,0,-1.16,1.16);
    paint.stroke();
  }
  paint.restore();
}

function drawAttackEffect(e) {
  const f=Math.max(0,e.life/e.max);
  paint.save();
  paint.globalAlpha=Math.min(1,f*1.75);
  if(e.kind==="ring"){
    outlinedCircle(e,Math.max(1,e.r*(1-f*.78)),e.color,2.7);
  } else if(e.kind==="pulse"){
    const progress=1-f;
    const bands=motion.matches?1:e.bands;
    if(e.pattern==="frost"||e.pattern==="evolution"){
      circle(e.x,e.y,Math.max(1,e.r*(.32+progress*.63)));
      paint.fillStyle=e.color;
      paint.globalAlpha=f*.13;
      paint.fill();
    }
    for(let n=0;n<bands;n++){
      const travel=progress*1.37-n*.11;
      if(travel<0) continue;
      const size=e.pattern==="magnet"?1-travel*.72:.20+travel*.8;
      const radius=Math.max(1,e.r*clamp(size,.15,1));
      paint.globalAlpha=f*(1-n*.12)*.82;
      if(e.pattern==="magnet") paint.setLineDash([11,7]);
      if(e.pattern==="sound"&&n%2===1) paint.setLineDash([14,7]);
      outlinedCircle(e,radius,e.color,Math.max(1,5.5-n*.78));
      paint.setLineDash([]);
      paint.globalAlpha=f*.33;
      outlinedCircle(e,radius+4,e.color,1.5);
    }
  } else if(e.kind==="trace"){
    paint.lineCap="round";
    paint.lineJoin="round";
    if(e.style==="gust"){
      const [from,to]=e.points;
      const head=movePoint(from,heading(from,to),distance(from,to)*(.22+(1-f)*.78));
      paint.globalAlpha=f*.23;
      line([from,head],e.color,11);
      drawWind(head,heading(from,to),e.color,f);
    } else if(e.style==="field"){
      paint.setLineDash([6,8]);
      paint.globalAlpha=f*.58;
      line(e.points,e.color,2);
    } else {
      const width=(e.style==="impact"?10:e.style==="beam"?7:4.8)*e.strength;
      paint.globalAlpha=f*.24;
      line(e.points,e.color,width*2.9);
      paint.globalAlpha=Math.min(.93,f*1.36);
      line(e.points,e.color,width);
      paint.globalAlpha=f*.92;
      line(e.points,"#fff6e2",Math.max(1,width*.34));
    }
  }
  paint.restore();
}

function drawLeafTrail(player,leaf,level) {
  const direction=leaf.outer?-1:1;
  const tail=leaf.outer?1.12:.42+level*.11;
  const radius=distance(player,leaf);
  paint.save();
  paint.lineCap="round";
  paint.strokeStyle=ATTACK_COLOR[leaf.outer?"solar":"leaf"];
  for(let layer=0;layer<2;layer++){
    paint.globalAlpha=layer===0?.20:.72;
    paint.lineWidth=leaf.outer?(layer===0?12:3.8):(layer===0?8:2.4);
    paint.beginPath();
    paint.arc(player.x,player.y,radius,leaf.angle-direction*tail*(layer===0?1:.57),leaf.angle,direction<0);
    paint.stroke();
  }
  paint.restore();
}

function drawBattle() {
  const p=game.player;
  const orbit=leaves();
  for(const zone of game.hazards){
    circle(zone.x,zone.y,zone.r);
    paint.fillStyle=zone.kind==="shade"?"#10141bad":"#95e0fa31";
    paint.fill();
    paint.strokeStyle=zone.kind==="shade"?"#c6a4f4":"#a4eaf3";
    paint.lineWidth=1.5;paint.stroke();
    if(zone.kind==="ice"){
      paint.fillStyle="#c8f8ff85";
      for(let i=0;i<12;i++){
        const crystal=movePoint(zone,i*2.39996,zone.r*(.2+(i%5)*.15));
        paint.fillRect(Math.round(crystal.x),Math.round(crystal.y),3,6);
        paint.fillRect(Math.round(crystal.x)-2,Math.round(crystal.y)+2,7,2);
      }
    }
  }
  for(const effect of game.effects) if(effect.kind!=="number") drawAttackEffect(effect);
  for(const wave of game.waves) drawWind(wave,wave.dir,ATTACK_COLOR.air,.9);
  if(!motion.matches) for(const leaf of orbit) drawLeafTrail(p,leaf,game.weaponSlots.leaf.level);
  for(const particle of game.particles){
    paint.globalAlpha=particle.life/particle.max;
    paint.fillStyle=particle.color;
    paint.fillRect(Math.round(particle.x),Math.round(particle.y),particle.size,particle.size);
  }
  paint.globalAlpha=1;
  for(const enemy of game.enemies) drawTell(enemy);
  for(const drop of game.drops) drawLoot(drop);
  for(const enemy of game.enemies) drawDrone(enemy);
  if(p.rooted) outlinedCircle(p,24,p.lit?"#ffe286d0":"#c9d99588",2);
  if(p.hit>0 && Math.floor(p.hit*16)%2) paint.globalAlpha=.58;
  treeAt(p.x,p.y,p.rooted?3:p.walking>0?1+(Math.floor(p.walking)%2):0,57,p.lit);
  paint.globalAlpha=1;
  for(const leaf of orbit){
    paint.save();
    paint.translate(leaf.x,leaf.y);
    paint.rotate(leaf.angle+Math.PI/4);
    paint.fillStyle=ATTACK_COLOR[leaf.outer?"solar":"leaf"];
    const k=leaf.outer?1.47:1.19+game.weaponSlots.leaf.level*.07;
    paint.fillRect(-7*k,-4*k,14*k,8*k);
    paint.fillRect(-4*k,-6*k,9*k,12*k);
    paint.fillStyle=leaf.outer?"#fff3b8":"#e1ffb9";
    paint.fillRect(0,-5*k,5*k,3*k);
    paint.fillStyle="#506d38";paint.fillRect(-5*k,0,10*k,2);
    paint.restore();
  }
  paint.font="bold 14px ui-monospace, Consolas, monospace";
  paint.textAlign="center";
  paint.lineWidth=3;
  paint.strokeStyle="#172119";
  for(const e of game.effects){
    if(e.kind!=="number") continue;
    paint.globalAlpha=Math.min(1,e.life/e.max*1.75);
    paint.strokeText(e.text,e.x,e.y);
    paint.fillStyle=e.color;
    paint.fillText(e.text,e.x,e.y);
  }
  paint.globalAlpha=1;
  for(const shot of game.shots){
    line([movePoint(shot,shot.angle,-14),shot],"#592d2c",6);
    line([movePoint(shot,shot.angle,-12),shot],"#ffae82",3.5);
    paint.fillStyle="#fff0c8";paint.fillRect(shot.x-3,shot.y-3,6,6);
  }
}

function drawMapPlayer(ctx,x,y) {
  ctx.beginPath();
  ctx.arc(x,y,9,0,TAU);
  ctx.fillStyle="#bdf278";
  ctx.fill();
  ctx.strokeStyle="#101d16";
  ctx.lineWidth=3;
  ctx.stroke();
}

function drawMinimap(c) {
  const width=Math.min(c.w,WORLD.w-c.x), height=Math.min(c.h,WORLD.h-c.y);
  const scale=Math.min(map.width/width,map.height/height);
  const left=(map.width-width*scale)/2, top=(map.height-height*scale)/2;
  const xOnMap=x=>left+(x-c.x)*scale;
  const yOnMap=y=>top+(y-c.y)*scale;

  mapPaint.fillStyle="#14231d";
  mapPaint.fillRect(0,0,map.width,map.height);
  mapPaint.save();
  mapPaint.beginPath();
  mapPaint.rect(left,top,width*scale,height*scale);
  mapPaint.clip();
  mapPaint.fillStyle="#1a2b23";
  mapPaint.fillRect(left,top,width*scale,height*scale);
  mapPaint.fillStyle="#bda34465";
  mapPaint.fillRect(xOnMap(sunAt(game.time)-LIGHT_WIDTH/2),top,LIGHT_WIDTH*scale,height*scale);
  mapPaint.fillStyle="#779481";
  for(const [x,y] of LANDMARKS) mapPaint.fillRect(xOnMap(x-33),yOnMap(y-12),66*scale,36*scale);

  const visibleEnemies=game.enemies.filter(enemy=>enemy.hp>0 &&
    enemy.x>=c.x && enemy.x<=c.x+width && enemy.y>=c.y && enemy.y<=c.y+height);
  mapPaint.fillStyle="#ff766c";
  mapPaint.beginPath();
  for(const enemy of visibleEnemies){
    if(enemy.type==="shade" || enemy.type==="final") continue;
    const x=xOnMap(enemy.x),y=yOnMap(enemy.y);
    mapPaint.moveTo(x+5,y);
    mapPaint.arc(x,y,5,0,TAU);
  }
  mapPaint.fill();

  for(const enemy of visibleEnemies){
    if(enemy.type!=="shade" && enemy.type!=="final") continue;
    const boss=enemy.type==="final";
    const x=xOnMap(enemy.x),y=yOnMap(enemy.y),r=boss?15:10;
    mapPaint.beginPath();
    mapPaint.moveTo(x,y-r);
    mapPaint.lineTo(x+r,y);
    mapPaint.lineTo(x,y+r);
    mapPaint.lineTo(x-r,y);
    mapPaint.closePath();
    mapPaint.fillStyle=boss?"#ee6558":"#ffbf78";
    mapPaint.fill();
    mapPaint.strokeStyle=boss?"#ffefd2":"#18251f";
    mapPaint.lineWidth=3;
    mapPaint.stroke();
  }

  drawMapPlayer(mapPaint,xOnMap(game.player.x),yOnMap(game.player.y));
  mapPaint.restore();
}

function drawFrame(now) {
  const dt=Math.min(.05,(now-(lastFrame||now))/1000);
  lastFrame=now;
  if(!motion.matches) coverTime+=dt;
  if(state==="run") tick(dt);
  if(view.w>0 && view.h>0){
    const display=game?.player||{x:WORLD.w/2,y:WORLD.h*.53};
    const c=camera(display);
    const factor=view.px*view.zoom;
    paint.setTransform(factor,0,0,factor,-c.x*factor,-c.y*factor);
    scene(c,game?.time??Math.min(20,coverTime/3));
    if(game){
      drawBattle();
      if(!compactLayout.matches||$("minimapPanel").dataset.expanded==="true") drawMinimap(c);
    } else {
      const foreground={x:c.x+c.w*(view.w<=560?.54:.71),y:c.y+c.h*(view.w<=560?.30:.50)};
      outlinedCircle(foreground,116,"#e8d99562",2);
      outlinedCircle(foreground,146,"#d4e29a38",1);
      treeAt(foreground.x,foreground.y,3,Math.min(c.w*.45,182),true);
      const accent=motion.matches?0:coverTime*.7;
      for(let i=0;i<5;i++){
        const point=movePoint(foreground,accent+i*TAU/5,120);
        paint.fillStyle=i%2?"#d9e780":"#f9d975";
        paint.fillRect(Math.floor(point.x),Math.floor(point.y),5,5);
      }
    }
    if(touch){
      paint.setTransform(view.px,0,0,view.px,0,0);
      const base=touch;
      outlinedCircle(base,28,"#e8f6c2a0",2);
      circle(base.x+base.dx*21,base.y+base.dy*21,8);
      paint.fillStyle="#dceaa7";paint.fill();
    }
  }
  requestAnimationFrame(drawFrame);
}

function keyValue(event){return event.key.length===1?event.key.toLowerCase():event.key;}
window.addEventListener("keydown",event=>{
  if(event.ctrlKey||event.altKey||event.metaKey) return;
  const key=keyValue(event);
  if(key==="m" && (state==="run" || state==="map")){
    if(event.repeat||event.isComposing) return;
    event.preventDefault();
    if(state==="map") closeMap();
    else openMap();
    return;
  }
  if(state==="quiz"){
    if(event.repeat||event.isComposing||!/^[1-3]$/.test(event.key)) return;
    const choice=Array.from(content.children).find(node=>node.dataset.quizKey===event.key);
    if(choice){event.preventDefault();choice.click();}
    return;
  }
  if(state!=="run") return;
  if(key==="Escape"||key==="p"){
    event.preventDefault();
    pauseMenu();
    return;
  }
  const move=keymap.get(key);
  if(!move) return;
  event.preventDefault();
  held.add(move);
});
window.addEventListener("keyup",event=>held.delete(keymap.get(keyValue(event))));
window.addEventListener("blur",resetInput);
document.addEventListener("visibilitychange",()=>{if(document.hidden && state==="run") pauseMenu();});
modal.addEventListener("cancel",event=>{
  event.preventDefault();
  if(state==="pause") resume();
  else if(state==="map") closeMap();
  else if(state==="gear") closeGear();
  else if(state==="help") game?pauseMenu():backToCover();
});
canvas.addEventListener("pointerdown",event=>{
  if(state!=="run"||touch||event.button!==0) return;
  const box=canvas.getBoundingClientRect();
  event.preventDefault();
  canvas.setPointerCapture(event.pointerId);
  touch={x:event.clientX-box.left,y:event.clientY-box.top,id:event.pointerId,dx:0,dy:0};
});
canvas.addEventListener("pointermove",event=>{
  if(touch?.id!==event.pointerId) return;
  const box=canvas.getBoundingClientRect();
  const x=event.clientX-box.left-touch.x,y=event.clientY-box.top-touch.y;
  const length=Math.max(28,Math.hypot(x,y));
  touch.dx=x/length;
  touch.dy=y/length;
});
for(const key of ["pointerup","pointercancel","lostpointercapture"]){
  canvas.addEventListener(key,event=>{if(touch?.id===event.pointerId) touch=null;});
}

$("start").addEventListener("click",start);
$("help").addEventListener("click",()=>help("cover"));
$("mapButton").addEventListener("click",openMap);
$("pause").addEventListener("click",pauseMenu);
$("minimapToggle").addEventListener("click",toggleMinimap);
$("gearButton").addEventListener("click",openGear);
renderEquipment($("weapons"),$("passives"),$("gearDetail"),{leaf:{level:1,evolved:false}},{});
new ResizeObserver(fit).observe(canvas);
fit();
requestAnimationFrame(drawFrame);
</script>
</body>
